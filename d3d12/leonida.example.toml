# Copy to `leonida.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# LEONIDA_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: LEONIDA_GAME_DIR
game_dir = 'D:\leonida-data\game'

# Derived data. Default: %LOCALAPPDATA%\leonida\cache.   env: LEONIDA_CACHE_DIR
# cache_dir = 'D:\leonida-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\leonida\data.   env: LEONIDA_DATA_DIR
# data_dir = 'D:\leonida-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: LEONIDA_TEST_TITLES (separated by ';')
test_titles = []
